[build]
rustflags = ["--cfg", "tokio_unstable"]

# --lib because the succinct toolchain ships no rustdoc, so doctest runs fail
# after the unit tests pass. Invoke as: cargo +succinct zkvm-test -p <crate>
[alias]
# Cross-compile for Ubuntu x86_64 (glibc 2.35 / Ubuntu 22.04 LTS)
build-linux = "zigbuild --target x86_64-unknown-linux-gnu.2.35"
build-linux-release = "zigbuild --release --target x86_64-unknown-linux-gnu.2.35"
# zkvm-test = "test --lib --target riscv64im-succinct-zkvm-elf"

# The rustflags mirror sp1-build's get_rust_compiler_flags (sp1-build/src/command/utils.rs)
# and must track it when sp1 is upgraded. 2013265920 = 0x78000000 = sp1 STACK_TOP.
[target.riscv64im-succinct-zkvm-elf]
runner = ["sh", "-c", 'exec "$bin" "$@"', "cargo-zkvm", "test"]
# runner = [
#   "sh",
#   "-c",
#   'bin="/Users/tcrypt/.sp1/bin/cargo-prover"; [ -x "$bin" ] || { echo "cargo-prover is not built; run: cargo build --release -p cargo-prover" >&2; exit 2; }; exec "$bin" "$@"',
#   "cargo-prover",
# ]
rustflags = [
  "-C",
  "passes=lower-atomic",
  "-C",
  "link-arg=--image-base=2013265920",
  "-C",
  "panic=abort",
  "--cfg",
  'getrandom_backend="custom"',
]

[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
