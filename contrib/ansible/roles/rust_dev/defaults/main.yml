---
# Account the toolchain is installed for. Everything under ~/.cargo and ~/.rustup
# belongs to this user; only apt and /usr/local writes run as root.
target_user: "{{ ansible_user | default('root') }}"
target_home: "{{ '/root' if target_user == 'root' else '/home/' + target_user }}"

# Default toolchain. Matches rust-toolchain.toml at the workspace root.
rust_version: "1.97.1"
rust_extra_toolchains:
  - stable
  - nightly
rust_components:
  - cargo
  - clippy
  - rustfmt
  - rust-analyzer
  - rust-src

# "latest" tracks the newest GitHub release; pin a version like "0.42.2" instead
# when reproducibility matters.
zellij_version: "latest"
zellij_bin: /usr/local/bin/zellij

# Base build toolchain plus the CLI tools. SP1-specific packages live in the
# sp1_builder role so the two lists never overlap.
rust_dev_packages:
  - build-essential
  - ca-certificates
  - curl
  - git
  - pkg-config
  - libssl-dev
  - neovim
  - zsh
  - ripgrep
  - fd-find
  - bat
  - jq
  - htop
  - tmux
  - rsync
  - unzip

cargo_intalled_packages:
  - eza

# Ubuntu ships these under different names to avoid clashes. Symlinked into
# ~/.local/bin under the names everyone actually types.
rust_dev_bin_aliases:
  - { link: bat, target: /usr/bin/batcat }
  - { link: fd, target: /usr/bin/fdfind }
