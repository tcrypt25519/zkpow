---
target_user: "{{ ansible_user | default('root') }}"
target_home: "{{ '/root' if target_user == 'root' else '/home/' + target_user }}"

# Toolchain the SP1 environment pins. Kept in step with the rust_dev role.
rust_version: "1.97.1"

# Droplets ship with no swap; release builds of the prover OOM without it.
swap_size_gb: 8
shm_size: "8G"

sp1_sysctl:
  - { name: vm.max_map_count, value: '524288' }
  - { name: fs.file-max, value: '2097152' }
  - { name: vm.swappiness, value: '10' }

# SP1-specific build dependencies. The base toolchain (build-essential, git,
# pkg-config, libssl-dev) comes from the rust_dev role.
sp1_packages:
  - clang
  - lld
  - cmake
  - protobuf-compiler
  - libprotobuf-dev
  - golang-go
  - libseccomp-dev
  - zlib1g-dev
  - procps
  - file
  - m4
  - sqlite3
