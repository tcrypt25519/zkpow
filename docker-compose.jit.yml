services:
  sp1-jit:
    build:
      context: .
      dockerfile: Dockerfile.sp1-jit
    image: sp1-jit:latest
    container_name: sp1-jit-dev
    platform: linux/amd64
    # Sized for SP1 execution trace chunks and gas estimation rings
    shm_size: '8gb'
    working_dir: /workspace
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-1.97.1}
      - CARGO_TARGET_DIR=/workspace/target/docker-linux-x86_64
    volumes:
      # Mount repository root
      - ./:/workspace
      # Cache cargo crates and git indexes across container rebuilds
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  cargo-cache:
    name: sp1-jit-cargo-cache
  cargo-git:
    name: sp1-jit-cargo-git
