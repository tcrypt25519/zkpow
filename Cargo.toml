[workspace]
members = [
    "crates/controller",
    "crates/core",
    "crates/core-macros",
    "crates/guest",
    "crates/host",
    "crates/store",
    "crates/sync-headers",
    "crates/cli",
]
resolver = "2"

[workspace.dependencies]
dhat = "0.3.3"
zkpow-controller = { path = "crates/controller" }
zkpow-core = { path = "crates/core" }
zkpow-core-macros = { path = "crates/core-macros" }
zkpow-guest = { path = "crates/guest" }
zkpow-host = { path = "crates/host" }
zkpow-store = { path = "crates/store" }
zkpow-sync-headers = { path = "crates/sync-headers" }
zkpow-cli = { path = "crates/cli" }
sp1-zkvm = { git = "https://github.com/succinctlabs/sp1", tag = "v6.1.0", default-features = false, features = ["lib", "verify"] }
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", tag = "v6.1.0", features = ["profiling"] }
sp1-build = { git = "https://github.com/succinctlabs/sp1", tag = "v6.1.0" }
sp1-derive = { git = "https://github.com/succinctlabs/sp1", tag = "v6.1.0" }
sp1-prover = { git = "https://github.com/succinctlabs/sp1", tag = "v6.1.0" }
sp1-recursion-gnark-ffi = { git = "https://github.com/succinctlabs/sp1", tag = "v6.1.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
bitcoin = { version = "0.32", features = ["serde"] }
bitcoin-io = "0.1"
tokio = { version = "1.52", features = ["full"] }
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
humantime = "2.3"
num-bigint = "0.4.6"
memuse = { path = "../memuse" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"
anyhow = "1"
axum = "0.8"
bincode = "1"
rust-s3 = { version = "0.37", default-features = false, features = ["sync-rustls-tls"] }

[patch."https://github.com/succinctlabs/sp1"]
sp1-prover = { path = "../../succinctlabs/sp1-v6.1.0-compression-logging/crates/prover" }
sp1-recursion-gnark-ffi = { path = "../../succinctlabs/sp1-v6.1.0-compression-logging/crates/recursion/gnark-ffi" }
sp1-sdk = { path = "../../succinctlabs/sp1-v6.1.0-compression-logging/crates/sdk" }

[profile.release]
debug = true          # Keeps debug symbols for your code
split-debuginfo = "off" # Ensures symbols stay in the binary

[profile.release.package."*"]
debug = true
