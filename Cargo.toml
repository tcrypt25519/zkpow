[workspace]
members = [
    "crates/controller",
    "crates/core",
    "crates/guest",
    "crates/host",
    "crates/sha256",
    "crates/store",
    "crates/sync-headers",
    "crates/cli",
    "crates/sp1-cycle",
    "crates/sp1-cycle-macros",
    "crates/derive-size",
]
resolver = "2"

[workspace.dependencies]
dhat = "0.3.3"
zkpow-controller = { path = "crates/controller" }
zkpow-core = { path = "crates/core" }
zkpow-guest = { path = "crates/guest" }
zkpow-host = { path = "crates/host" }
zkpow-sha256 = { path = "crates/sha256" }
zkpow-store = { path = "crates/store" }
zkpow-sync-headers = { path = "crates/sync-headers" }
zkpow-cli = { path = "crates/cli" }
sp1-cycle = { path = "crates/sp1-cycle" }
sp1-cycle-macros = { path = "crates/sp1-cycle-macros" }
derive-size = { path = "crates/derive-size" }
sp1-zkvm = { version = "6.3.1", default-features = false, features = ["lib", "verify"] }
sp1-sdk = { path = "/Users/tcrypt/code/github.com/succinctlabs/sp1/crates/sdk", features = [
    "profiling",
] }
sp1-build = { path = "/Users/tcrypt/code/github.com/succinctlabs/sp1/crates/build" }
sp1-derive = { path = "/Users/tcrypt/code/github.com/succinctlabs/sp1/crates/derive" }
sp1-prover = { path = "/Users/tcrypt/code/github.com/succinctlabs/sp1/crates/prover" }
sp1-recursion-gnark-ffi = { path = "/Users/tcrypt/code/github.com/succinctlabs/sp1/crates/recursion/gnark-ffi" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
bitcoin = { version = "0.32", features = ["serde"] }
bitcoin-io = "0.1"
tokio = { version = "1.52", features = ["full"] }
hex = "0.4.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
humantime = "2.3"
num-bigint = "0.4.6"
memuse = { path = "../memuse" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.10"
reqwest = { version = "0.13.4", features = ["json"] }
serde_json = "1.0"
anyhow = "1"
axum = "0.8"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
rust-s3 = { version = "0.37", default-features = false, features = [
    "sync-rustls-tls",
] }
bytemuck = { version = "1.25.1", features = ["derive"] }
rkyv = { version = "0.8.17", default-features = false, features = [
    "alloc",
    "bytecheck",
    "little_endian",
    "aligned",
] }
bytes = { version = "1.10.1" }

# [patch."https://github.com/succinctlabs/sp1"]
# sp1-prover = { path = "../../succinctlabs/sp1-v6.1.0-compression-logging/crates/prover" }
# sp1-recursion-gnark-ffi = { path = "../../succinctlabs/sp1-v6.1.0-compression-logging/crates/recursion/gnark-ffi" }
# sp1-sdk = { path = "../../succinctlabs/sp1-v6.1.0-compression-logging/crates/sdk" }

[profile.release]
debug = true            # Keep debug symbols
split-debuginfo = "off" # Ensures symbols stay in the binary

[profile.release.package."*"]
debug = true
