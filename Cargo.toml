[workspace]
members = [
  "crates/controller",
  "crates/core",
  "crates/guest",
  "crates/host",
  "crates/mtp",
  "crates/sha256",
  "crates/store",
  "crates/sync-headers",
  "crates/cli",
  "crates/derive-size",
  "crates/wire_type",
  "crates/params",
  "crates/types",
  "crates/sha256_const",
  "crates/worker",
  "crates/test_support",
]
exclude = ["sp1"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.82"

[workspace.dependencies]
zkpow-controller = { path = "crates/controller" }
zkpow-core = { path = "crates/core" }
zkpow-sha256 = { path = "crates/sha256" }
zkpow-store = { path = "crates/store" }
zkpow-sync-headers = { path = "crates/sync-headers" }
zkpow-params = { path = "crates/params" }
zkpow-types = { path = "crates/types" }
zkpow-worker = { path = "crates/worker" }
zkpow-mtp = { path = "crates/mtp" }

derive-size = { path = "crates/derive-size" }
wire_type = { path = "crates/wire_type" }
sha256_const = { path = "crates/sha256_const" }
test-support = { path = "crates/test_support" }
zkvm-test = { path = "../zkvm-test/crates/zkvm-test" }

##
## SP1
##
sp1-build = { version = "6.8.1" }
sp1-derive = { version = "6.8.1" }
sp1-lib = { version = "6.8.1" }
sp1-sdk = { version = "6.8.1" }
sp1-zkvm = { version = "6.8.1", default-features = false, features = [
  "lib",
  "verify",
] }
sp1-prover = { version = "6.8.1", default-features = false, features = [
  "bigint-rug",
  "debug",
] }
sp1-core-executor = { version = "6.8.1" }
sp1-core-executor-runner = { version = "6.8.1" }
sp1-jit = { version = "6.8.1" }

sha2 = { version = "0.10.8" }
bitcoin = { version = "0.32", features = ["serde"] }

tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

tokio = { version = "1.53.1", features = ["full"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
num-bigint = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
rand = "0.10.2"

bytemuck = { version = "1.25.2", features = ["derive"] }
rkyv = { version = "0.8.18", default-features = false, features = [
  "alloc",
  "bytecheck",
  "little_endian",
  "aligned",
] }

##
## To remove
##
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }

# const-gen = { version = "1.6.9", default-features = false, features = [
#   "derive",
# ] }

[patch.crates-io]
# Route sha2 through SP1's accelerated fork so the sha256 compress runs on the precompile
# instead of the soft path. Tag matches the sibling crypto patches SP1 6.x pins.
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.2.0", package = "sha2" }
# sp1-zkvm = { path = "../../succinctlabs/sp1/crates/zkvm/entrypoint" }
# sp1-sdk = { path = "../../succinctlabs/sp1/crates/sdk" }
# sp1-prover = { path = "../../succinctlabs/sp1/crates/prover" }
# sp1-core-executor = { path = "../../succinctlabs/sp1/crates/core/executor" }
# sp1-core-machine = { path = "../../succinctlabs/sp1/crates/core/machine" }
# sp1-build = { path = "../../succinctlabs/sp1/crates/build" }
# sp1-lib = { path = "../../succinctlabs/sp1/crates/zkvm/lib" }
# sp1-primitives = { path = "../../succinctlabs/sp1/crates/primitives" }
# sp1-jit = { path = "../../succinctlabs/sp1/crates/core/jit" }
# sp1-core-executor-runner = { path = "../../succinctlabs/sp1/crates/core/runner" }
# sp1-core-executor-runner-binary = { path = "../../succinctlabs/sp1/crates/core/runner-binary" }
zkvm-test = { path = "../zkvm-test/crates/zkvm-test" }
zkvm-test-macros = { path = "../zkvm-test/crates/zkvm-test-macros" }

[profile.release]
incremental = false
strip = "none"

[profile.release.package."*"]
incremental = false
strip = "none"

[profile.release.build-override]
strip = "none"

[profile.dev]
incremental = false
lto = false
opt-level = 0

[profile.dev.package."*"]
incremental = false
