[workspace]
members = [
  "crates/controller",
  "crates/core",
  "crates/guest",
  "crates/host",
  "crates/sha256",
  "crates/store",
  "crates/sync-headers",
  "crates/cli",
  "crates/sp1-cycle",
  "crates/sp1-cycle-macros",
  "crates/derive-size",
  "crates/params",
  "crates/types",
  "crates/sha256_const",
  "crates/worker",
  "crates/zkvm-test-runner",
  "crates/zkvm-test",
  "crates/zkvm-test-macros",
  "crates/test_support",

]
resolver = "3"

[workspace.dependencies]
zkpow-controller = { path = "crates/controller" }
zkpow-core = { path = "crates/core" }
zkpow-guest = { path = "crates/guest" }
zkpow-host = { path = "crates/host" }
zkpow-sha256 = { path = "crates/sha256" }
zkpow-store = { path = "crates/store" }
zkpow-sync-headers = { path = "crates/sync-headers" }
zkpow-cli = { path = "crates/cli" }
zkpow-params = { path = "crates/params" }
zkpow-types = { path = "crates/types" }
zkpow-worker = { path = "crates/worker" }

derive-size = { path = "crates/derive-size" }
sha256_const = { path = "crates/sha256_const" }
sp1-cycle = { path = "crates/sp1-cycle" }
sp1-cycle-macros = { path = "crates/sp1-cycle-macros" }
test-support = { path = "crates/test_support" }
zkvm-test = { path = "crates/zkvm-test" }
zkvm-test-macros = { path = "crates/zkvm-test-macros" }

##
## SP1
##
sp1-build = { version = "6.5.0" }
sp1-derive = { version = "6.5.0" }
sp1-lib = { version = "6.5.0" }
sp1-sdk = { version = "6.5.0", features = ["profiling"] }
sp1-zkvm = { version = "6.5.0", default-features = false, features = [
  "lib",
  "verify",
] }
sp1-recursion-gnark-ffi = { version = "6.5.0", default-features = false }
sp1-prover = { version = "6.5.0", default-features = false, features = [
  "profiling",
  "bigint-rug",
  "debug",
  "mprotect",
] }
sp1-core-executor = { version = "6.5.0", features = ["profiling"] }

memuse = { path = "../memuse" }
dhat = "0.3.3"
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
bitcoin = { version = "0.32", features = ["serde"] }
bitcoin-io = "0.6.0"

tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

tokio = { version = "1.53.1", features = ["full"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
humantime = "2.4"
num-bigint = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
rand = "0.10.2"
anyhow = "1.0.104"

bytemuck = { version = "1.25.2", features = ["derive"] }
rkyv = { version = "0.8.18", default-features = false, features = [
  "alloc",
  "bytecheck",
  "little_endian",
  "aligned",
] }
bytes = { version = "1.12.1" }

##
## To remove
##
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }

const-gen = { version = "1.6.9", default-features = false, features = [
  "derive",
] }

[patch.crates-io]
sp1-zkvm = { path = "/Users/tcrypt/code/github.com/succinctlabs/sp1/crates/zkvm/entrypoint" }

[profile.release]
incremental = false

[profile.release.package."*"]
incremental = false

[profile.dev]
incremental = false
lto = false
opt-level = 0

[profile.dev.package."*"]
incremental = false
