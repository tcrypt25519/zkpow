[workspace]
members = [
    "crates/controller",
    "crates/core",
    "crates/guest",
    "crates/host",
    "crates/sha256",
    "crates/store",
    "crates/sync-headers",
    "crates/cli",
    "crates/sp1-cycle",
    "crates/sp1-cycle-macros",
    "crates/derive-size",
    "crates/params",
    "crates/types",
    "crates/sha256_const",
    "crates/worker",
]
resolver = "3"

[workspace.dependencies]
zkpow-controller = { path = "crates/controller" }
zkpow-core = { path = "crates/core" }
zkpow-guest = { path = "crates/guest" }
zkpow-host = { path = "crates/host" }
zkpow-sha256 = { path = "crates/sha256" }
sha256_const = { path = "crates/sha256_const" }
zkpow-store = { path = "crates/store" }
zkpow-sync-headers = { path = "crates/sync-headers" }
zkpow-cli = { path = "crates/cli" }
zkpow-params = { path = "crates/params" }
zkpow-types = { path = "crates/types" }
zkpow-worker = { path = "crates/worker" }
derive-size = { path = "crates/derive-size" }
sp1-cycle = { path = "crates/sp1-cycle" }
sp1-cycle-macros = { path = "crates/sp1-cycle-macros" }

sp1-zkvm = { version = "6.4.0", default-features = false, features = [
    "lib",
    "verify",
] }
sp1-sdk = { version = "6.4.0", features = ["profiling"] }
sp1-build = { version = "6.4.0" }
sp1-derive = { version = "6.4.0" }
sp1-prover = { version = "6.4.0", default-features = false, features = [
    "profiling",
    "bigint-rug",
    "debug",
    "mprotect"
] }
sp1-recursion-gnark-ffi = { version = "6.4.0", default-features = false }


memuse = { path = "../memuse" }
dhat = "0.3.3"
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
bitcoin = { version = "0.32", features = ["serde"] }
bitcoin-io = "0.6.0"

tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }


tokio = { version = "1.52", features = ["full"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
humantime = "2.3"
num-bigint = "0.4.8"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.20"
rand = "0.10.2"
anyhow = "1.0.104"

bytemuck = { version = "1.25.2", features = ["derive"] }
rkyv = { version = "0.8.18", default-features = false, features = [
    "alloc",
    "bytecheck",
    "little_endian",
    "aligned",
] }
bytes = { version = "1.12" }

##
## To remove
##
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }

const-gen = { version = "1.6.9", default-features = false, features = [
    "derive",
] }

[patch.crates-io]
sp1-sdk = { path = "../../succinctlabs/sp1/crates/sdk" }
sp1-build = { path = "../../succinctlabs/sp1/crates/build" }
sp1-derive = { path = "../../succinctlabs/sp1/crates/derive" }
sp1-prover = { path = "../../succinctlabs/sp1/crates/prover" }
sp1-zkvm = { path = "../../succinctlabs/sp1/crates/zkvm/entrypoint" }
sp1-recursion-gnark-ffi = { path = "../../succinctlabs/sp1/crates/recursion/gnark-ffi" }

[profile.dev.package."*"]
incremental = false

[profile.release.package."*"]
debug = true
incremental = false


[profile.release]
debug = true            # Keep debug symbols
split-debuginfo = "off" # Ensures symbols stay in the binary

[profile.dev]
incremental = false
lto = false
opt-level = 0
