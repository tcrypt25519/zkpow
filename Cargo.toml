[workspace]
members = [
    "crates/controller",
    "crates/core",
    "crates/guest",
    "crates/host",
    "crates/sha256",
    "crates/store",
    "crates/sync-headers",
    "crates/cli",
    "crates/sp1-cycle",
    "crates/sp1-cycle-macros",
    "crates/derive-size",
]
resolver = "2"

[workspace.dependencies]
zkpow-controller = { path = "crates/controller" }
zkpow-core = { path = "crates/core" }
zkpow-guest = { path = "crates/guest" }
zkpow-host = { path = "crates/host" }
zkpow-sha256 = { path = "crates/sha256" }
zkpow-store = { path = "crates/store" }
zkpow-sync-headers = { path = "crates/sync-headers" }
zkpow-cli = { path = "crates/cli" }
derive-size = { path = "crates/derive-size" }
sp1-cycle = { path = "crates/sp1-cycle" }
sp1-cycle-macros = { path = "crates/sp1-cycle-macros" }

sp1-zkvm = { version = "6.3.1", default-features = false, features = ["lib", "verify"] }
sp1-sdk = { version = "6.3.1", features = ["profiling"] }
sp1-build = { version = "6.3.1" }
sp1-derive = { version = "6.3.1" }
sp1-prover = { version = "6.3.1" }
sp1-recursion-gnark-ffi = { version = "6.3.1" }


memuse = { path = "../memuse" }
dhat = "0.3.3"
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
bitcoin = { version = "0.32", features = ["serde"] }
bitcoin-io = "0.6.0"

tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }

tokio = { version = "1.52", features = ["full"] }
hex = "0.4.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }
humantime = "2.3"
num-bigint = "0.5.1"
clap = { version = "4.6.6", features = ["derive"] }
thiserror = "2.0.19"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
anyhow = "1.0.104"
axum = "0.8"

bytemuck = { version = "1.25.2", features = ["derive"] }
rkyv = { version = "0.8.18", default-features = false, features = [
    "alloc",
    "bytecheck",
    "little_endian",
    "aligned",
] }
bytes = { version = "1.12" }

##
## To remove
##
serde_json = "1.0"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
rust-s3 = { version = "0.37.2", default-features = false, features = [
    "sync-rustls-tls",
] }

[patch.crates-io]
sp1-sdk = { path = "../../succinctlabs/sp1/crates/sdk" }
sp1-build = { path = "../../succinctlabs/sp1/crates/build" }
sp1-derive = { path = "../../succinctlabs/sp1/crates/derive" }
sp1-prover = { path = "../../succinctlabs/sp1/crates/prover" }
sp1-zkvm = { path = "../../succinctlabs/sp1/crates/zkvm/entrypoint" }
sp1-recursion-gnark-ffi = { path = "../../succinctlabs/sp1/crates/recursion/gnark-ffi" }


[profile.release]
debug = true            # Keep debug symbols
split-debuginfo = "off" # Ensures symbols stay in the binary

[profile.release.package."*"]
debug = true
