[package]
name = "zkpow-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zkpow-host"
path = "src/main.rs"

[[bin]]
name = "sp1-stress"
path = "src/bin/sp1-stress.rs"

[lib]
path = "src/lib.rs"

[dependencies]
zkpow-core = { workspace = true }
zkpow-controller = { workspace = true }
zkpow-params = { workspace = true }
zkpow-worker = { workspace = true }
console-subscriber = "0.4.1"
sp1-sdk = { workspace = true }
sp1-prover = { workspace = true }
memuse = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
hex = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-appender = "0.2"
sha2 = { workspace = true, features = ["std"] }

[build-dependencies]
sp1-build = { workspace = true }

[features]
default = []
CUDA = ["sp1-sdk/cuda"]
memory-diagnostics = []
slow-tests = []
