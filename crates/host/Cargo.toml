[package]
name = "zkpow-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zkpow-host"
path = "src/main.rs"

[[bin]]
name = "sp1_stress"
path = "src/bin/sp1_stress.rs"

[[bin]]
name = "host_hash_vectors"
path = "src/bin/host_hash_vectors.rs"

[lib]
path = "src/lib.rs"

[dependencies]
zkpow-core = { workspace = true, features = ["host"] }
zkpow-sha256 = { workspace = true, features = ["host"] }
zkpow-controller = { workspace = true }
console-subscriber = "0.4.1"
sp1-sdk = { workspace = true }
sp1-prover = { workspace = true }
sp1-recursion-gnark-ffi = { workspace = true, features = ["native"] }
memuse = { workspace = true }
postcard = { workspace = true, features = ["alloc"] }
hex = { workspace = true }
num-bigint = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
sha2 = { workspace = true, features = ["std"] }


[dev-dependencies]
axum = { workspace = true }

[build-dependencies]
sp1-build = { workspace = true }

[features]
default = []
CUDA = ["sp1-sdk/cuda"]
memory-diagnostics = []
slow-tests = []
