[package]
name = "zkpow-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
profiling = ["sp1-cycle/cycle-tracking"]
# The reproducible fake header chain in `chain.rs`, for other crates' tests.
test-support = []


[dependencies]
#sp1-zkvm = { workspace = true }
sp1-lib = { workspace = true }
thiserror = { version = "2.0", default-features = false }
bytemuck = { workspace = true }
sp1-cycle = { workspace = true }
sp1-cycle-macros = { workspace = true }
zkpow-mtp-typestate = { workspace = true }
zkpow-params = { workspace = true }
zkpow-types = { workspace = true }
zkpow-sha256 = { workspace = true }
rkyv = { workspace = true }
#bytes = { workspace = true }
derive-size = { workspace = true }

[dev-dependencies]
zkpow-params = { workspace = true, features = ["test-networks"] }
zkvm-test = { workspace = true }
