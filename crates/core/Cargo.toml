[package]
name = "zkpow-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
host = ["dep:serde"]
profiling = []

[dependencies]
#sp1-zkvm = { workspace = true }
thiserror = { version = "2.0", default-features = false }
bytemuck = { workspace = true }
serde = { workspace = true, optional = true }
sp1-cycle = { workspace = true }
sp1-cycle-macros = { workspace = true }
zkpow-sha256 = { workspace = true }
sha2 = { workspace = true }
rkyv = { workspace = true }
#bytes = { workspace = true }
derive-size = { workspace = true }
