[package]
name = "zkpow-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[features]
host = ["dep:sha2"]
profiling = []

[dependencies]
sha2 = { workspace = true, optional = true }
sp1-zkvm = { workspace = true }
thiserror = { version = "2.0", default-features = false }
zkpow-core-macros = { workspace = true }
