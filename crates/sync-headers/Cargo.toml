[package]
name = "zkpow-sync-headers"
version = "0.1.0"
edition = "2021"
description = "Bitcoin block-header synchronization over the Bitcoin P2P network"

[lib]
name = "sync_headers"
path = "src/lib.rs"

[dependencies]
zkpow-core = { workspace = true, features = ["host"] }
zkpow-sha256 = { workspace = true, features = ["host"] }
bitcoin.workspace = true
bitcoin-io.workspace = true
rand.workspace = true
tracing.workspace = true
thiserror.workspace = true
