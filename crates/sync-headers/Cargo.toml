[package]
name = "zkpow-sync-headers"
version = "0.1.0"
edition = "2021"
description = "Bitcoin block-header synchronization (P2P network and Alchemy RPC backends)"

[lib]
name = "sync_headers"
path = "src/lib.rs"

[dependencies]
zkpow-core = { workspace = true, features = ["host"] }
bitcoin.workspace = true
bitcoin-io.workspace = true
rand.workspace = true
tracing.workspace = true
thiserror.workspace = true
# Alchemy RPC backend
tokio.workspace = true
reqwest.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
hex.workspace = true
