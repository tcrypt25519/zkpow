[package]
name = "zkpow-controller"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zkpow-controller-serve"
path = "src/bin/serve.rs"

[lib]
path = "src/lib.rs"

[dependencies]
zkpow-core = { workspace = true, features = ["host"] }
zkpow-store = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
