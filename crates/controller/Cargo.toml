[package]
name = "zkpow-controller"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zkpow-controller-serve"
path = "src/bin/serve.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
# Cryptographic verification of uploaded proofs in the serve binary
# (loads the guest ELF from ZKPOW_GUEST_ELF at startup).
sp1-verify = ["dep:sp1-sdk", "dep:sp1-prover"]

[dependencies]
zkpow-core = { workspace = true, features = ["host"] }
zkpow-sha256 = { workspace = true, features = ["host"] }
zkpow-store = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
axum = { workspace = true }
rusqlite = { workspace = true }
rust-s3 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sp1-sdk = { workspace = true, optional = true }
sp1-prover = { workspace = true, optional = true }
postcard = { workspace = true }
serde = { workspace = true }
rkyv.workspace = true
