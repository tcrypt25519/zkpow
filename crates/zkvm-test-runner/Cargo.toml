[package]
name = "zkvm-test-runner"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "zkvm_test_runner"
path = "src/lib.rs"

[[bin]]
name = "zkvm-test-runner"
path = "src/main.rs"

[[bin]]
name = "cargo-zkvm-test"
path = "src/cargo_plugin.rs"

[features]
default = []
cuda = []

[dependencies]
sp1-sdk = { workspace = true }
sp1-core-executor = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
memuse = { workspace = true }
regex = "1.10"
