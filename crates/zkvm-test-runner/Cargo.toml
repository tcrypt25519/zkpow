[package]
name = "zkvm-test-runner"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "zkvm_test_runner"
path = "src/lib.rs"

[[bin]]
name = "zkvm-test-runner"
path = "src/main.rs"

[[bin]]
name = "cargo-zkvm"
path = "src/cargo_plugin.rs"

[[bin]]
name = "cargo-zkvm-test"
path = "src/cargo_zkvm_test_compat.rs"

[features]
default = []
cuda = []

[dependencies]
sp1-sdk = { workspace = true }
sp1-core-executor = { workspace = true }
sp1-core-executor-runner = { workspace = true }
sp1-jit = { workspace = true }
object = "0.36"
rustc-demangle = "0.1"
tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
memuse = { workspace = true }
nextest-filtering = "0.22"
guppy = "0.17"
nextest-metadata = "0.15"
clap = { workspace = true }
zkvm-test = { workspace = true }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
