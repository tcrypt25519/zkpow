[supervisord]
nodaemon=true
user=root

[program:zkpow-host]
command=/usr/local/bin/zkpow-host
directory=/data
autorestart=unexpected
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:proof-sync]
command=bash -c '[ -n "$S3_DEST" ] || exit 0; while sleep 30; do aws s3 sync "$ZKPOW_PROOF_STORE_DIR" "$S3_DEST" --no-progress ${AWS_ENDPOINT_URL:+--endpoint-url "$AWS_ENDPOINT_URL"} || true; done'
directory=/data
autorestart=unexpected
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
