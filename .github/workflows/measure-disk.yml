name: measure-disk

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/measure-disk.yml

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Image version
        run: cat /imagegeneration/imagedata.json || true

      - name: Filesystems
        run: |
          df -h || true
          echo "--- / and /mnt only ---"
          df -h / /mnt || true
          echo "--- lsblk ---"
          lsblk || true
          echo "--- memory and swap ---"
          free -h || true
          swapon --show || true

      - name: Purge candidates
        run: |
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                   /opt/hostedtoolcache /usr/local/share/powershell \
                   /usr/lib/jvm /usr/local/share/boost /usr/local/share/chromium \
                   /usr/local/lib/node_modules /usr/local/.ghcup /var/lib/docker \
                   /usr/local/share/vcpkg /opt/pipx /opt/az /usr/local/julia* ; do
            if [ -e "$d" ]; then sudo du -shx "$d" 2>/dev/null || true; fi
          done | sort -h || true

      - name: hostedtoolcache breakdown
        run: sudo du -shx /opt/hostedtoolcache/* 2>/dev/null | sort -h || true

      - name: Largest directories under /usr /opt /var
        run: sudo du -xhd2 /usr /opt /var 2>/dev/null | sort -h | tail -40 || true

      - name: Docker
        run: |
          docker system df || true
          echo "--- preloaded images ---"
          docker image ls -a || true

      - name: Swap file
        run: |
          ls -lh /mnt/swapfile /swapfile 2>/dev/null || true
          cat /proc/swaps || true
