name: docker

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zkpow

      - uses: actions/checkout@v4
        with:
          repository: tcrypt25519/zkvm-test
          ssh-key: ${{ secrets.ZKVM_TEST_DEPLOY_SSH_KEY }}
          path: zkvm-test

      - uses: docker/setup-buildx-action@v3

      - run: make docker DOCKER_IMAGE=tcrypt/zkpow-prover
        working-directory: zkpow/docker

      - uses: docker/login-action@v3
        with:
          username: tylersmith
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - run: docker push tcrypt/zkpow-prover:latest
