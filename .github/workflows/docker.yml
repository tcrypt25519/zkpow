name: docker

on:
  workflow_dispatch:

env:
  DOCKER_IMAGE: tylersmith/zkpow-prover:latest

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zkpow

      - uses: actions/checkout@v4
        with:
          repository: tcrypt25519/zkvm-test
          token: ${{ secrets.ZKVM_TEST_TOKEN }}
          path: zkvm-test

      - name: Install SP1
        run: |
          curl -L https://sp1.succinct.xyz | bash
          "$HOME/.sp1/bin/sp1up"
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: tylersmith
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - run: make docker DOCKER_IMAGE="$DOCKER_IMAGE" DOCKER_FEATURES=cuda
        working-directory: zkpow

      - run: docker push "$DOCKER_IMAGE"
